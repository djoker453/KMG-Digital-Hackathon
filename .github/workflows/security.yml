name: KMG Security AI Agent

on:
  push:
    branches:
      - "**"

  pull_request:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    env:
      AI_PROVIDER: openrouter
      AI_MODEL: qwen/qwen3.8-27b:free
      AI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep python-dotenv openai

      - name: Run security agent
        run: |
          python -m security_agent.agent

      - name: Run Security Gate
        run: |
          python security_gate.py

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-reports/security-report.json
