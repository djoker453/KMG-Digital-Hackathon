name: KMG Security AI Agent

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep python-dotenv openai

      - name: Run Information Security Checks
        run: |
          python -m security_agent.checks.runner

      - name: Run Security Agent
              - name: Run Security Agent
        env:
          AI_PROVIDER: openrouter
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: qwen/qwen3.8-27b:free
        run: |
          python -m security_agent.agent

      - name: Run Security Gate
        run: |
          python security_gate.py /tmp/kmg-security-reports/security-report.json


      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            security-reports/security-report.json
            security-reports/security-report.md
            /tmp/kmg-security-reports/semgrep.json
